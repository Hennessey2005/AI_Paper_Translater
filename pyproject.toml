[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-translate"
version = "0.1.0"
description = "PDF 论文 → 深度理解包（中文译文 + LaTeX 公式注册表 + 图表内容描述），面向 Agent 知识库"
requires-python = ">=3.10"
dependencies = [
    "mineru>=4.0,<5",
    "pyyaml",
    "openai",
    "json-repair",
]

[project.scripts]
paper-translate = "paper_translate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
