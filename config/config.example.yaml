# 论文翻译工具配置模板
# 复制为 config.yaml 后填写；config.yaml 已被 .gitignore 忽略

# ---- 资源路由 ----
resource_mode: auto        # auto | cpu | gpu   auto=探测 torch.cuda 与显存
tier: basic                # MinerU 档位: basic(CPU小模型) | standard(小模型+VLM) | flash(快读)

gpu:
  min_vram_gb: 8

# ---- API 路由 ----
api_route:
  figure_understanding: always   # always | gpu_first | never   (S3 图表理解)
  formula_low_confidence: never  # never | fallback             (S2 低置信度公式精修)
  translation: always            # always(在线) | offline(Ollama) (S4 翻译)
  llm_aided: false               # MinerU 内置 API 后处理(标题分级/跨页表格)

# ---- API 提供方（OpenAI 兼容协议，三选一或自行扩展）----
# 到 M3/M4 阶段需要 key 时再填
api:
  provider: siliconflow    # siliconflow | bigmodel | custom
  base_url: https://api.siliconflow.cn/v1
  api_key: ""              # 待填：控制台「API keys」页生成
  # 图表理解多模态模型（实测口径）。注意：请求会附带 enable_thinking:false，
  # 仅 Qwen3-VL 密集(dense)系列支持，MoE 变体如 Qwen/Qwen3-VL-30B-A3B-Instruct
  # 会直接报「不支持参数 'enable_thinking'」；Qwen2.5-VL 系列硅基流动已下架
  vlm_model: "Qwen/Qwen3-VL-32B-Instruct"
  # 翻译文本模型（M4 选型实测确认；DeepSeek 系列兼容 enable_thinking 参数）
  llm_model: "deepseek-ai/DeepSeek-V4.1-Flash"
  # 代理策略：留空=强制直连（推荐，国内端点不受 VPN 开关影响）
  # "env"=跟随系统环境变量；或填代理 URL 如 http://127.0.0.1:7897
  proxy: ""
  max_concurrency: 4
  budget_limit_usd: 1.0    # 单篇成本上限，超过暂停

# ---- 输出 ----
output:
  bilingual: true          # 是否生成中英对照版
  lang_target: zh
